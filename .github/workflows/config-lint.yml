name: Validate Aigit Configuration

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  changes:
    name: Detect configuration changes
    runs-on: ubuntu-latest
    outputs:
      config_changed: ${{ steps.filter.outputs.config_changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -Fxq ".aigit/config.json"; then
            echo "config_changed=true" >> "$GITHUB_OUTPUT"
            echo ".aigit/config.json changed."
          else
            echo "config_changed=false" >> "$GITHUB_OUTPUT"
            echo ".aigit/config.json did not change."
          fi

  validate-json:
    name: Validate JSON configuration
    needs: changes
    if: needs.changes.outputs.config_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python -m json.tool \
            .aigit/config.json \
            > /dev/null

          echo "JSON configuration is valid."
name: Build Release Executables

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            archive: aigit-linux-x64.tar.gz
          - target: windows-x64
            os: windows-latest
            archive: aigit-windows-x64.zip
          - target: macos-arm64
            os: macos-14
            archive: aigit-macos-arm64.tar.gz

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller \
            --onefile \
            --clean \
            --name aigit \
            --paths src \
            src/aigit/__main__.py

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          tar -C dist -czf "$ARCHIVE" aigit
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          Compress-Archive `
            -Path dist\aigit.exe `
            -DestinationPath "$env:ARCHIVE"

          $hash = (Get-FileHash "$env:ARCHIVE" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARCHIVE" | Set-Content "$env:ARCHIVE.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Attach release assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create combined checksum file
        shell: bash
        run: |
          set -euo pipefail

          find release-assets \
            -maxdepth 1 \
            -type f \
            -name '*.sha256' \
            -print0 \
            | xargs -0 cat \
            | sort -k2 \
            > release-assets/checksums.txt

          rm release-assets/*.sha256

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -print

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" \
            release-assets/*.tar.gz \
            release-assets/*.zip \
            release-assets/checksums.txt \
            --clobber
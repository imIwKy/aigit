[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigit"
version = "0.3.0"
description = "AI-assisted Git workflow tools"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0"
]

[project.scripts]
aigit = "aigit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
     "ruff>=0.8",
     "bandit[toml]>=1.7.9",
     "pip-audit>=2.7"
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
target = ["src"]
exclude_dirs = [
    "tests",
    ".venv",
    "build",
    "dist"
]